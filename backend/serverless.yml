service: chatbot-modes

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  httpApi:
    cors: true
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    COHERE_API_KEY: ${env:COHERE_API_KEY}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    JWT_SECRET: ${env:JWT_SECRET}
    INGEST_QUEUE_URL:
      Ref: IngestQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - Fn::GetAtt: [IngestQueue, Arn]

functions:
  health:
    handler: handlers/health.handler
    events:
      - httpApi:
          path: /api/health
          method: get
  dbtest:
    handler: handlers/dbtest.handler
    events:
      - httpApi:
          path: /api/dbtest
          method: get
  llmtest:
    handler: handlers/llmtest.handler
    events:
      - httpApi:
          path: /api/llmtest
          method: get

  # --- auth ---
  signup:
    handler: handlers/signup.handler
    events:
      - httpApi:
          path: /api/auth/signup
          method: post
  login:
    handler: handlers/login.handler
    events:
      - httpApi:
          path: /api/auth/login
          method: post
  googleAuth:
    handler: handlers/googleAuth.handler
    events:
      - httpApi:
          path: /api/auth/google
          method: post

  chat:
    handler: handlers/chat.handler
    events:
      - httpApi:
          path: /api/chat
          method: post
  listConversations:
    handler: handlers/listConversations.handler
    events:
      - httpApi:
          path: /api/conversations
          method: get
  getMessages:
    handler: handlers/getMessages.handler
    events:
      - httpApi:
          path: /api/conversations/{id}/messages
          method: get
  renameConversation:
    handler: handlers/renameConversation.handler
    events:
      - httpApi:
          path: /api/conversations/{id}
          method: patch
  deleteConversation:
    handler: handlers/deleteConversation.handler
    events:
      - httpApi:
          path: /api/conversations/{id}
          method: delete
  # The dashboard's one read: every scored turn this user has, oldest first.
  progress:
    handler: handlers/progress.handler
    events:
      - httpApi:
          path: /api/progress
          method: get
  embedtest:
    handler: handlers/embedtest.handler
    events:
      - httpApi:
          path: /api/embedtest
          method: get
  ingest:
    handler: handlers/ingest.handler
    events:
      - httpApi:
          path: /api/ingest
          method: post
  ask:
    handler: handlers/ask.handler
    events:
      - httpApi:
          path: /api/ask
          method: post
  documentStatus:
    handler: handlers/documentStatus.handler
    events:
      - httpApi:
          path: /api/documents/{id}
          method: get
  ingestWorker:
    handler: handlers/ingestWorker.handler
    timeout: 300
    events:
      - sqs:
          arn:
            Fn::GetAtt: [IngestQueue, Arn]
          batchSize: 1

resources:
  Resources:
    IngestQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ripple-ingest-queue
        VisibilityTimeout: 360
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [IngestDLQ, Arn]
          maxReceiveCount: 3
    IngestDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ripple-ingest-dlq
        MessageRetentionPeriod: 1209600

plugins:
  - serverless-offline